spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5555/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:demo}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
app:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
