name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 #v4

      - name: Make Gradle wrapper executable
        run: test -f gradlew && chmod +x gradlew

      - name: Build
        run: ./gradlew clean assemble

      - name: Tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Sonar analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.AUTHSERVICE_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v6
        with:
          context: .
          push: false
          tags: auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max